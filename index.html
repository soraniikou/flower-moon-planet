<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="A quiet Earth Day journey among stars—think of someone, and watch your thought circle the planet once.">
<title>today, a small planet — earth day</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Shippori+Mincho:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #f5efe3;
    font-family: 'Shippori Mincho', 'Cormorant Garamond', serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  canvas {
    display: block;
    position: absolute;
    inset: 0;
    z-index: 2;
  }

  /* ============ UI Overlays ============ */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 1s ease, visibility 0s linear 1s;
    z-index: 10;
    text-align: center;
  }

  .overlay.active {
    opacity: 1;
    visibility: visible;
    transition: opacity 1s ease, visibility 0s linear 0s;
    pointer-events: none; /* overlay itself never blocks */
  }

  /* Inner interactive elements re-enable pointer events */
  .overlay.active button,
  .overlay.active input,
  .overlay.active .tap-hint,
  .overlay.active a {
    pointer-events: auto;
  }

  #scene-opening {
    z-index: 20;
  }

  #tap-layer {
    position: absolute;
    inset: 0;
    z-index: 25;
    cursor: pointer;
    background: transparent;
    -webkit-tap-highlight-color: transparent;
  }

  .overlay.fade-input {
    pointer-events: auto;
  }

  /* ============ Scene 1: Opening ============ */
  #scene-opening .line1 {
    display: none;
    font-size: clamp(1rem, 4vw, 1.5rem);
    font-weight: 300;
    letter-spacing: 0.3em;
    color: #8a8578;
    opacity: 0;
    animation: fadeSlow 3s ease 0.8s forwards;
  }
  #scene-opening .line2 {
    font-size: clamp(0.85rem, 3vw, 1.1rem);
    font-weight: 300;
    letter-spacing: 0.2em;
    color: #6a6558;
    margin-top: 1.5rem;
    opacity: 0;
    animation: fadeSlow 3s ease 2.5s forwards;
  }
  #scene-opening .tap-hint {
    position: absolute;
    bottom: 8vh;
    font-size: 0.75rem;
    letter-spacing: 0.4em;
    color: #c9c2b4;
    opacity: 0;
    animation: pulse 2.5s ease 1.5s infinite;
  }

  @keyframes fadeSlow {
    to { opacity: 1; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.65; }
    50% { opacity: 1; }
  }

  /* ============ Scene 2: Zoom out ============ */
  #scene-zoom .text {
    font-size: clamp(1.1rem, 4vw, 1.6rem);
    font-weight: 300;
    letter-spacing: 0.25em;
    color: #f5efe3;
    opacity: 0;
    line-height: 2;
  }
  #scene-zoom .text.show { animation: fadeIn 2.5s ease forwards; }

  @keyframes fadeIn {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ============ Scene 3: Earth interaction ============ */
  #scene-earth {
    justify-content: space-between;
    padding: 8vh 2rem 10vh;
  }

  #scene-earth .top-text {
    font-size: clamp(0.95rem, 3.5vw, 1.3rem);
    font-weight: 300;
    letter-spacing: 0.2em;
    color: #f5efe3;
    line-height: 2;
    max-width: 30ch;
    opacity: 0;
    animation: fadeIn 2s ease 0.5s forwards;
  }

  #scene-earth .bottom-hint {
    font-size: 0.7rem;
    letter-spacing: 0.4em;
    color: #d4cec2;
    opacity: 0;
    animation: fadeIn 2s ease 2s forwards;
    text-transform: lowercase;
  }

  .next-btn {
    margin-top: 1.5rem;
    padding: 0.9rem 2.2rem;
    background: transparent;
    border: 1px solid rgba(245, 239, 227, 0.4);
    color: #f5efe3;
    font-family: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    cursor: pointer;
    transition: all 0.4s ease;
    backdrop-filter: blur(4px);
    text-transform: lowercase;
    opacity: 0;
    animation: fadeIn 1.5s ease 4s forwards;
  }

  .next-btn:hover, .next-btn:active {
    background: rgba(245, 239, 227, 0.08);
    border-color: rgba(245, 239, 227, 0.8);
    letter-spacing: 0.4em;
  }

  /* ============ Scene 4: Someone ============ */
  #scene-think {
    justify-content: center;
    gap: 2rem;
  }

  #scene-think .prompt {
    font-size: clamp(1rem, 3.8vw, 1.4rem);
    font-weight: 300;
    letter-spacing: 0.2em;
    line-height: 2;
    max-width: 26ch;
    color: #f5efe3;
  }

  #scene-think .sub {
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    color: #a8a295;
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
  }

  #name-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(245, 239, 227, 0.4);
    color: #f5efe3;
    font-family: inherit;
    font-size: 1.1rem;
    text-align: center;
    padding: 0.8rem 1rem;
    width: min(80%, 320px);
    letter-spacing: 0.1em;
    outline: none;
    transition: border-color 0.3s ease;
  }
  #name-input:focus {
    border-bottom-color: #f5c870;
  }
  #name-input::placeholder {
    color: #6a6558;
    font-style: italic;
  }

  /* ============ Scene 5: Message ============ */
  #scene-message .msg {
    font-size: clamp(1.1rem, 4vw, 1.5rem);
    font-weight: 300;
    letter-spacing: 0.2em;
    line-height: 2.2;
    max-width: 28ch;
    color: #f5efe3;
    opacity: 0;
  }
  #scene-message .msg.show { animation: fadeIn 3s ease forwards; }

  #scene-message .highlight {
    color: #f5c870;
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
  }

  /* ============ Scene 6: Future ============ */
  #scene-future {
    justify-content: space-between;
    padding: 10vh 2rem;
  }

  #scene-future .future-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 36rem;
    min-height: 28vh;
    position: relative;
  }

  #scene-future .top {
    font-size: clamp(0.85rem, 3vw, 1.1rem);
    letter-spacing: 0.3em;
    color: #8a8578;
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    transition: opacity 2.5s ease;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
  }

  #scene-future .center {
    font-size: clamp(1.1rem, 4vw, 1.5rem);
    font-weight: 300;
    letter-spacing: 0.25em;
    line-height: 2.2;
    max-width: 22ch;
    color: #f5efe3;
    opacity: 0;
    transition: opacity 2.5s ease;
  }

  #scene-future .future-meet {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 15;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.2em 0.45em;
    font-size: clamp(0.95rem, 3.4vw, 1.3rem);
    font-weight: 300;
    letter-spacing: 0.18em;
    line-height: 2;
    width: min(92vw, 34rem);
    padding: 0 1rem;
    color: #f5efe3;
    text-shadow: 0 0 28px rgba(0, 0, 0, 0.55);
    opacity: 1;
    visibility: hidden;
    pointer-events: none;
  }

  #scene-future .future-meet.is-active {
    visibility: visible;
    flex-direction: column;
    flex-wrap: nowrap;
    gap: 0.35em 0;
  }

  #scene-future .future-meet .meet-line {
    display: flex;
    flex-wrap: nowrap;
    justify-content: center;
    align-items: center;
    gap: 0 0.45em;
  }

  #scene-future .future-meet .meet-word {
    display: inline-flex;
    white-space: nowrap;
  }

  #scene-future .future-meet .word {
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 1.2s ease, transform 1.2s ease;
  }

  #scene-future .future-meet .word.show {
    opacity: 1;
    transform: translateY(0);
  }

  #future-bg {
    position: fixed;
    inset: -12%;
    z-index: 1;
    pointer-events: none;
    background: #000000;
    opacity: 0;
    filter: blur(0);
    transform: scale(1);
    transition: opacity 1.5s ease, filter 2s ease, transform 2s ease;
  }

  #future-bg.active {
    opacity: 1;
    filter: blur(72px);
    transform: scale(1.1);
  }

  #future-bg-haze {
    position: fixed;
    inset: -25%;
    z-index: 8;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(
      ellipse 70% 60% at 50% 48%,
      rgba(122, 63, 88, 0.55) 0%,
      rgba(90, 48, 70, 0.28) 45%,
      transparent 72%
    );
    filter: blur(40px);
    transition: opacity 3s ease;
  }

  #future-bg-haze.active {
    opacity: 1;
  }

  /* ============ Restart (final screen) ============ */
  .restart {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 25;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem 1.5rem calc(1.1rem + env(safe-area-inset-bottom, 0px));
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    color: #c9c2b4;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.35) 0%, transparent 100%);
    border: none;
    cursor: pointer;
    font-family: inherit;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.6s ease, color 0.3s ease, visibility 0s linear 0.6s;
    text-transform: lowercase;
    pointer-events: none;
  }

  .restart.show {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.6s ease, color 0.3s ease, visibility 0s linear 0s;
    pointer-events: auto;
  }

  .restart:hover { color: #f5efe3; }

  /* ============ Grain overlay ============ */
  .grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.04;
    z-index: 100;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode: overlay;
  }

</style>

<body>

<div id="app">
  <div id="future-bg" aria-hidden="true"></div>
  <div id="future-bg-haze" aria-hidden="true"></div>
  <canvas id="canvas"></canvas>

  <!-- Scene 1: Opening -->
  <div class="overlay active" id="scene-opening">
    <div class="line1"></div>
    <div class="line2">— what are you doing right now</div>
    <div class="tap-hint">tap to begin</div>

  <!-- Scene 2: Zoom out -->
  <div class="overlay" id="scene-zoom">

  <!-- Scene 3: Earth (interactive) -->
  <div class="overlay" id="scene-earth">

      perhaps the Earth<br>has grown<br>a little kinder

</div>

<script type="module">
import * as THREE from 'three';

// ============ Global state ============
let scene, camera, renderer, earth, clouds, atmosphere, stars, glowGroup;
let rotationVelocity = 0;
let targetRotationY = 0;
let isDragging = false;
let lastPointerX = 0;
let currentScene = 'opening';
let cameraTargetZ = 15;
let cameraZ = 15;
let scrollPhase = 0; // 0 = far, 1 = close
let thoughtLights = [];
let arcLines = [];
let openingTriggered = false;
let futureTimers = [];
let futureBgRaf = null;
const earthCenterScreen = new THREE.Vector3();

const FUTURE_BG_COLORS = [
  { t: 0, hex: 0x000000 },
  { t: 0.25, hex: 0x3d2458 },
  { t: 0.5, hex: 0x141f38 },
  { t: 0.75, hex: 0x1e3d6e },
  { t: 1, hex: 0x7a3f58 }
];

const MEET_LINES = [
  'Everything led me to meet my',
  'everything'
];
const MEET_CHAR_GAP = 285;

function hexToRgb(hex) {
  return {
    r: (hex >> 16) & 255,
    g: (hex >> 8) & 255,
    b: hex & 255
  };
}

function lerpHex(a, b, t) {
  const c1 = hexToRgb(a);
  const c2 = hexToRgb(b);
  const r = Math.round(c1.r + (c2.r - c1.r) * t);
  const g = Math.round(c1.g + (c2.g - c1.g) * t);
  const bl = Math.round(c1.b + (c2.b - c1.b) * t);
  return (r << 16) | (g << 8) | bl;
}

function rgbCss(hex) {
  const { r, g, b } = hexToRgb(hex);
  return `rgb(${r}, ${g}, ${b})`;
}

function sampleFutureBgColor(progress) {
  const p = Math.max(0, Math.min(1, progress));
  for (let i = 0; i < FUTURE_BG_COLORS.length - 1; i++) {
    const a = FUTURE_BG_COLORS[i];
    const b = FUTURE_BG_COLORS[i + 1];
    if (p >= a.t && p <= b.t) {
      const local = (p - a.t) / (b.t - a.t);
      return lerpHex(a.hex, b.hex, local);
    }
  }
  return FUTURE_BG_COLORS[FUTURE_BG_COLORS.length - 1].hex;
}

function clearFutureTimers() {
  futureTimers.forEach(id => clearTimeout(id));
  futureTimers = [];
  if (futureBgRaf) cancelAnimationFrame(futureBgRaf);
  futureBgRaf = null;
}

function scheduleFuture(fn, ms) {
  futureTimers.push(setTimeout(fn, ms));
}

function resetFutureScene() {
  clearFutureTimers();
  const futureText = document.getElementById('future-text');
  const futureMeet = document.getElementById('future-meet');
  const futureTop = document.querySelector('#scene-future .top');
  const futureBg = document.getElementById('future-bg');
  futureText.style.opacity = '0';
  futureText.style.display = '';
  futureText.style.visibility = '';
  futureText.innerHTML = 'perhaps the Earth<br>has grown<br>a little kinder';
  futureMeet.innerHTML = '';
  futureMeet.classList.remove('is-active');
  futureMeet.style.color = '';
  futureMeet.style.left = '50%';
  futureMeet.style.top = '50%';
  if (futureTop) {
    futureTop.style.opacity = '';
    futureTop.style.transition = '';
  }
  futureBg.classList.remove('active');
  futureBg.style.background = '#000000';
  futureBg.style.filter = '';
  futureBg.style.transform = '';
  const futureHaze = document.getElementById('future-bg-haze');
  if (futureHaze) futureHaze.classList.remove('active');
  renderer.setClearColor(0x000000, 1);
  if (scene.fog) scene.fog.color.setHex(0x000000);
}

function getIdealCameraZ(scene) {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const isMobile = w < 768;
  const isPortrait = h > w;

  // Base distances for desktop
  let base;
  if (scene === 'earth') base = 8;
  else if (scene === 'think') base = 7;
  else if (scene === 'message') base = 7;
  else if (scene === 'future') base = 11;
  else base = 15;

  // Scale up (pull camera back) for mobile/portrait
  if (isMobile && isPortrait) {
    return base * 2.0; // pull back on mobile portrait (smaller earth on screen)
  } else if (isPortrait) {
    return base * 1.3;
  } else if (isMobile) {
    return base * 1.3;
  }
  return base;
}

// ============ Three.js setup ============
function init() {
  const canvas = document.getElementById('canvas');
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x000000, 0.02);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  const startZ = getIdealCameraZ('opening');
  camera.position.z = startZ;
  cameraZ = cameraTargetZ = startZ;

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 1);

  // === Lights ===
  const ambient = new THREE.AmbientLight(0x222233, 0.6);
  scene.add(ambient);

  const sun = new THREE.DirectionalLight(0xfff0dd, 1.8);
  sun.position.set(5, 2, 5);
  scene.add(sun);

  const rim = new THREE.DirectionalLight(0x4477aa, 0.6);
  rim.position.set(-5, -1, -3);
  scene.add(rim);

  // === Starfield ===
  const starGeo = new THREE.BufferGeometry();
  const starCount = 3000;
  const starPositions = new Float32Array(starCount * 3);
  const starColors = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    const r = 200 + Math.random() * 300;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    starPositions[i*3] = r * Math.sin(phi) * Math.cos(theta);
    starPositions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    starPositions[i*3+2] = r * Math.cos(phi);
    const c = 0.7 + Math.random() * 0.3;
    const warm = Math.random() > 0.8 ? 0.85 : 1;
    starColors[i*3] = c * warm;
    starColors[i*3+1] = c * (warm * 0.95);
    starColors[i*3+2] = c;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
  const starMat = new THREE.PointsMaterial({
    size: 0.8, vertexColors: true, transparent: true, opacity: 0.9,
    sizeAttenuation: true, depthWrite: false
  });
  stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  // === Earth (procedural, no external textures) ===
  const earthGeo = new THREE.SphereGeometry(3, 128, 128);

  // Create procedural earth texture via canvas
  const earthTexture = createEarthTexture();
  const nightTexture = createNightTexture();

  const earthMat = new THREE.ShaderMaterial({
    uniforms: {
      dayMap: { value: earthTexture },
      nightMap: { value: nightTexture },
      sunDirection: { value: new THREE.Vector3(5, 2, 5).normalize() },
      time: { value: 0 }
    },
    vertexShader: `
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vWorldPos;
      void main() {
        vUv = uv;
        vNormal = normalize(normalMatrix * normal);
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vWorldPos = worldPos.xyz;
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `,
    fragmentShader: `
      uniform sampler2D dayMap;
      uniform sampler2D nightMap;
      uniform vec3 sunDirection;
      uniform float time;
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vWorldPos;

      void main() {
        vec3 n = normalize(vNormal);
        float sunDot = dot(n, sunDirection);
        float mixer = smoothstep(-0.2, 0.2, sunDot);

        vec3 dayCol = texture2D(dayMap, vUv).rgb;
        vec3 nightCol = texture2D(nightMap, vUv).rgb;

        // Soft terminator warmth
        float warmth = 1.0 - smoothstep(-0.1, 0.3, abs(sunDot));
        vec3 warmCol = mix(dayCol, dayCol * vec3(1.3, 1.05, 0.85), warmth * 0.6);

        vec3 color = mix(nightCol, warmCol, mixer);

        // Add subtle fresnel for atmosphere feel at edges
        float fresnel = pow(1.0 - abs(dot(n, vec3(0.0, 0.0, 1.0))), 2.5);
        color += vec3(0.3, 0.5, 0.8) * fresnel * 0.25;

        gl_FragColor = vec4(color, 1.0);
      }
    `
  });

  earth = new THREE.Mesh(earthGeo, earthMat);
  scene.add(earth);

  // === Clouds ===
  const cloudGeo = new THREE.SphereGeometry(3.05, 64, 64);
  const cloudTexture = createCloudTexture();
  const cloudMat = new THREE.MeshPhongMaterial({
    map: cloudTexture,
    transparent: true,
    opacity: 0.45,
    depthWrite: false
  });
  clouds = new THREE.Mesh(cloudGeo, cloudMat);
  scene.add(clouds);

  // === Atmosphere glow ===
  const atmGeo = new THREE.SphereGeometry(3.3, 64, 64);
  const atmMat = new THREE.ShaderMaterial({
    uniforms: {
      glowColor: { value: new THREE.Color(0x6ab0ff) }
    },
    vertexShader: `
      varying vec3 vNormal;
      varying vec3 vPositionNormal;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        vPositionNormal = normalize((modelViewMatrix * vec4(position, 1.0)).xyz);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 glowColor;
      varying vec3 vNormal;
      varying vec3 vPositionNormal;
      void main() {
        float intensity = pow(1.0 - abs(dot(vNormal, vPositionNormal)), 3.0);
        gl_FragColor = vec4(glowColor, 1.0) * intensity * 0.9;
      }
    `,
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide,
    transparent: true,
    depthWrite: false
  });
  atmosphere = new THREE.Mesh(atmGeo, atmMat);
  scene.add(atmosphere);

  // Group for thought lights
  glowGroup = new THREE.Group();
  earth.add(glowGroup);

  // Start earth invisible (we zoom in from black)
  earth.scale.setScalar(0.001);
  clouds.scale.setScalar(0.001);
  atmosphere.scale.setScalar(0.001);

  window.addEventListener('resize', onResize);
  setupInteraction();
  animate();
}

// ============ Texture generators ============
function createEarthTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 2048; canvas.height = 1024;
  const ctx = canvas.getContext('2d');

  // Ocean base gradient
  const oceanGrad = ctx.createLinearGradient(0, 0, 0, 1024);
  oceanGrad.addColorStop(0, '#0a2a4a');
  oceanGrad.addColorStop(0.3, '#1a4a7a');
  oceanGrad.addColorStop(0.5, '#1f5a8a');
  oceanGrad.addColorStop(0.7, '#1a4a7a');
  oceanGrad.addColorStop(1, '#0a2a4a');
  ctx.fillStyle = oceanGrad;
  ctx.fillRect(0, 0, 2048, 1024);

  // Add ocean noise
  for (let i = 0; i < 4000; i++) {
    const x = Math.random() * 2048;
    const y = Math.random() * 1024;
    const r = Math.random() * 3;
    ctx.fillStyle = `rgba(${100+Math.random()*50}, ${150+Math.random()*60}, ${200+Math.random()*55}, ${Math.random() * 0.3})`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Luminous soft green — smooth flowing mist (reference: bright lime, no hard edges)
  drawLuminousFlowingGreen(ctx, 2048, 1024);

  // Polar ice
  const iceGrad1 = ctx.createLinearGradient(0, 0, 0, 120);
  iceGrad1.addColorStop(0, 'rgba(240, 248, 255, 0.95)');
  iceGrad1.addColorStop(1, 'rgba(240, 248, 255, 0)');
  ctx.fillStyle = iceGrad1;
  ctx.fillRect(0, 0, 2048, 120);

  const iceGrad2 = ctx.createLinearGradient(0, 900, 0, 1024);
  iceGrad2.addColorStop(0, 'rgba(240, 248, 255, 0)');
  iceGrad2.addColorStop(1, 'rgba(240, 248, 255, 0.95)');
  ctx.fillStyle = iceGrad2;
  ctx.fillRect(0, 900, 2048, 124);

  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = THREE.RepeatWrapping;
  tex.anisotropy = 8;
  return tex;
}

function buildSmoothBlobPoints(cx, cy, baseR, aspect, phase) {
  const n = 80;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const t = (i / n) * Math.PI * 2;
    const w =
      0.14 * Math.sin(t * 1.15 + phase) +
      0.12 * Math.cos(t * 1.75 - phase * 0.5) +
      0.05 * Math.sin(t * 2.2 + 0.4);
    const r = baseR * (1 + w);
    pts.push({ x: cx + Math.cos(t) * r, y: cy + Math.sin(t) * r * aspect });
  }
  return pts;
}

function pathFromPoints(ctx, pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    ctx.lineTo(pts[i].x, pts[i].y);
  }
  ctx.closePath();
}

function drawSoftMistGradientsInClip(ctx, w, h, cx, cy, baseR) {
  const layers = 22;
  for (let i = 0; i < layers; i++) {
    const ang = (i / layers) * Math.PI * 2 + 0.7;
    const dist = baseR * (0.15 + Math.random() * 0.75);
    const gx = cx + Math.cos(ang) * dist * 0.9;
    const gy = cy + Math.sin(ang) * dist * 0.75;
    const rad = baseR * (0.25 + Math.random() * 0.55);
    const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, rad);
    g.addColorStop(0, 'rgba(200, 255, 175, 0.42)');
    g.addColorStop(0.35, 'rgba(150, 235, 140, 0.32)');
    g.addColorStop(0.6, 'rgba(110, 210, 120, 0.18)');
    g.addColorStop(1, 'rgba(70, 160, 100, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }
  for (let j = 0; j < 12; j++) {
    const gx = cx + (Math.random() - 0.5) * baseR * 1.5;
    const gy = cy + (Math.random() - 0.5) * baseR * 1.2;
    const rx = baseR * (0.35 + Math.random() * 0.5);
    const ry = baseR * (0.2 + Math.random() * 0.35);
    const rot = Math.random() * Math.PI;
    ctx.save();
    ctx.translate(gx, gy);
    ctx.rotate(rot);
    const g2 = ctx.createRadialGradient(0, 0, 0, 0, 0, Math.max(rx, ry) * 1.2);
    g2.addColorStop(0, 'rgba(210, 255, 185, 0.28)');
    g2.addColorStop(0.5, 'rgba(140, 225, 130, 0.16)');
    g2.addColorStop(1, 'rgba(90, 170, 105, 0)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawLuminousFlowingGreen(ctx, w, h) {
  const regions = [
    { cx: 1100, cy: 500, R: 118, asp: 0.86, ph: 0.3 },
    { cx: 1260, cy: 395, R: 152, asp: 0.84, ph: 1.1 },
    { cx: 495, cy: 455, R: 125, asp: 0.85, ph: 2.0 },
    { cx: 465, cy: 655, R: 105, asp: 0.82, ph: 0.6 },
    { cx: 1660, cy: 705, R: 88, asp: 0.8, ph: 1.7 },
    { cx: 905, cy: 295, R: 58, asp: 0.78, ph: 0.9 },
    { cx: 1390, cy: 615, R: 52, asp: 0.76, ph: 1.3 },
    { cx: 1755, cy: 485, R: 62, asp: 0.8, ph: 0.2 }
  ];

  regions.forEach(r => {
    const pts = buildSmoothBlobPoints(r.cx, r.cy, r.R, r.asp, r.ph);
    pathFromPoints(ctx, pts);
    ctx.save();
    ctx.clip();
    drawSoftMistGradientsInClip(ctx, w, h, r.cx, r.cy, r.R);
    ctx.restore();
  });

  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.14;
  for (let k = 0; k < 20; k++) {
    const cx = Math.random() * w;
    const cy = 100 + Math.random() * (h - 200);
    const rx = 80 + Math.random() * 160;
    const ry = 25 + Math.random() * 70;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(Math.random() * Math.PI);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, Math.max(rx, ry));
    g.addColorStop(0, 'rgba(220, 255, 200, 0.35)');
    g.addColorStop(1, 'rgba(100, 180, 120, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function createNightTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = 512;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#020612';
  ctx.fillRect(0, 0, 1024, 512);

  // City lights clusters — suggestive of inhabited continents
  const lightClusters = [
    { x: 625, y: 250, count: 200, spread: 80 }, // Africa
    { x: 650, y: 180, count: 400, spread: 120 }, // Europe/Asia
    { x: 780, y: 210, count: 300, spread: 90 },  // East Asia
    { x: 250, y: 225, count: 250, spread: 100 }, // Americas
    { x: 225, y: 325, count: 150, spread: 70 },  // S America
    { x: 825, y: 350, count: 80, spread: 50 },   // Australia
  ];

  lightClusters.forEach(cluster => {
    for (let i = 0; i < cluster.count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = Math.random() * cluster.spread;
      const x = cluster.x + Math.cos(angle) * r;
      const y = cluster.y + Math.sin(angle) * r;
      const brightness = 0.3 + Math.random() * 0.7;
      const size = 0.5 + Math.random() * 1.5;

      const grad = ctx.createRadialGradient(x, y, 0, x, y, size * 3);
      grad.addColorStop(0, `rgba(255, 220, 140, ${brightness})`);
      grad.addColorStop(0.5, `rgba(255, 180, 80, ${brightness * 0.4})`);
      grad.addColorStop(1, 'rgba(255, 150, 50, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, size * 3, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = THREE.RepeatWrapping;
  return tex;
}

function createCloudTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = 512;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.fillRect(0, 0, 1024, 512);

  // Swirling cloud formations
  for (let i = 0; i < 40; i++) {
    const cx = Math.random() * 1024;
    const cy = Math.random() * 512;
    const baseR = 30 + Math.random() * 80;

    for (let j = 0; j < 30; j++) {
      const angle = Math.random() * Math.PI * 2;
      const r = Math.random() * baseR;
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r * 0.6;
      const size = 10 + Math.random() * 25;
      const alpha = 0.15 + Math.random() * 0.25;

      const grad = ctx.createRadialGradient(x, y, 0, x, y, size);
      grad.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
      grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = THREE.RepeatWrapping;
  return tex;
}

// ============ Interaction ============
function setupInteraction() {
  const canvas = document.getElementById('canvas');

  const onDown = (e) => {
    if (currentScene !== 'earth' && currentScene !== 'think' && currentScene !== 'message' && currentScene !== 'future') return;
    isDragging = true;
    lastPointerX = e.clientX || (e.touches && e.touches[0].clientX);
  };
  const onMove = (e) => {
    if (!isDragging) return;
    const x = e.clientX || (e.touches && e.touches[0].clientX);
    const dx = x - lastPointerX;
    rotationVelocity = dx * 0.005;
    lastPointerX = x;
  };
  const onUp = () => { isDragging = false; };

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(e); }, { passive: false });
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onMove(e); }, { passive: false });
  canvas.addEventListener('touchend', onUp);

  // Opening tap — dedicated tap layer, always on top, cannot fail
  const tapLayer = document.getElementById('tap-layer');
  const handleOpeningTap = (e) => {
    if (openingTriggered || currentScene !== 'opening') return;
    openingTriggered = true;
    if (e) e.preventDefault();
    // Remove the tap layer so it doesn't block later interactions
    tapLayer.style.display = 'none';
    goToZoom();
  };
  tapLayer.addEventListener('click', handleOpeningTap);
  tapLayer.addEventListener('touchstart', handleOpeningTap, { passive: false });
  tapLayer.addEventListener('pointerdown', handleOpeningTap);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  const farZ = getIdealCameraZ('opening');
  if (currentScene === 'zoom') {
    const eased = Math.min(earth.scale.x, 1);
    const nearZ = getIdealCameraZ('earth');
    cameraTargetZ = farZ - eased * (farZ - nearZ);
  } else if (currentScene === 'opening') {
    cameraTargetZ = farZ;
  } else {
    cameraTargetZ = getIdealCameraZ(currentScene);
  }
}

// ============ Scene transitions ============
function showScene(id) {
  document.querySelectorAll('.overlay').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('scene-' + id);
  if (el) el.classList.add('active');
  currentScene = id;
}

window.goToZoom = function() {
  showScene('zoom');
  // Start zoom-in animation: earth scales up from tiny
  const zoomText = document.getElementById('zoom-text');
  const lines = [
    'From your room,',
    'from the town, the country,',
    'and then—',
    'this star came into view.'
  ];
  let idx = 0;
  zoomText.innerHTML = '';
  const showNext = () => {
    if (idx < lines.length) {
      zoomText.innerHTML = lines[idx];
      zoomText.classList.remove('show');
      void zoomText.offsetWidth;
      zoomText.classList.add('show');
      idx++;
      setTimeout(showNext, 2500);
    } else {
      setTimeout(() => goToEarth(), 2000);
    }
  };
  showNext();

  // Animate earth scale
  const startTime = performance.now();
  const duration = 20000;
  const animateScale = () => {
    const t = Math.min((performance.now() - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    const scale = eased;
    earth.scale.setScalar(scale);
    clouds.scale.setScalar(scale);
    atmosphere.scale.setScalar(scale);
    const farZ = getIdealCameraZ('opening');
    const targetZ = getIdealCameraZ('earth');
    cameraTargetZ = farZ - eased * (farZ - targetZ);
    if (t < 1) requestAnimationFrame(animateScale);
  };
  animateScale();
};

window.goToEarth = function() {
  showScene('earth');
  cameraTargetZ = getIdealCameraZ('earth');
};

window.goToThink = function() {
  showScene('think');
  cameraTargetZ = getIdealCameraZ('think');
  setTimeout(() => {
    document.getElementById('name-input').focus();
  }, 500);
};

window.sendThought = function() {
  const input = document.getElementById('name-input');
  const name = input.value.trim();
  // Proceed even if empty — you can still just "think" of someone

  // Spawn a light on earth surface
  spawnThoughtLight();

  // Show message
  const msgEl = document.getElementById('msg-text');
  const displayName = name || 'them';
  msgEl.innerHTML = `Your thought,<br>just now, to <span class="highlight">${escapeHtml(displayName)}</span>,<br>has gone once around the Earth.`;

  showScene('message');
  cameraTargetZ = getIdealCameraZ('message');
  msgEl.classList.remove('show');
  void msgEl.offsetWidth;
  msgEl.classList.add('show');

  setTimeout(() => goToFuture(), 6000);
};

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function spawnThoughtLight() {
  // Two points on earth surface, connected by an arc
  const theta1 = Math.random() * Math.PI * 2;
  const phi1 = Math.acos(2 * Math.random() - 1);
  const theta2 = Math.random() * Math.PI * 2;
  const phi2 = Math.acos(2 * Math.random() - 1);

  const r = 3.02;
  const p1 = new THREE.Vector3(
    r * Math.sin(phi1) * Math.cos(theta1),
    r * Math.cos(phi1),
    r * Math.sin(phi1) * Math.sin(theta1)
  );
  const p2 = new THREE.Vector3(
    r * Math.sin(phi2) * Math.cos(theta2),
    r * Math.cos(phi2),
    r * Math.sin(phi2) * Math.sin(theta2)
  );

  // Glowing point sprites
  const spriteMat = new THREE.SpriteMaterial({
    map: createGlowTexture(),
    color: 0xffd97a,
    blending: THREE.AdditiveBlending,
    transparent: true,
    depthWrite: false
  });

  [p1, p2].forEach(p => {
    const sprite = new THREE.Sprite(spriteMat.clone());
    sprite.position.copy(p);
    sprite.scale.set(0.001, 0.001, 0.001);
    glowGroup.add(sprite);
    thoughtLights.push({ sprite, birth: performance.now() });
  });

  // Arc between the two points
  const arcPoints = [];
  const steps = 60;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const p = new THREE.Vector3().lerpVectors(p1, p2, t);
    // Lift into arc
    const lift = Math.sin(t * Math.PI) * 1.2;
    p.normalize().multiplyScalar(r + lift);
    arcPoints.push(p);
  }
  const arcGeo = new THREE.BufferGeometry().setFromPoints(arcPoints);
  const arcMat = new THREE.LineBasicMaterial({
    color: 0xffd97a,
    transparent: true,
    opacity: 0,
    blending: THREE.AdditiveBlending
  });
  const arc = new THREE.Line(arcGeo, arcMat);
  glowGroup.add(arc);
  arcLines.push({ line: arc, birth: performance.now() });
}

function createGlowTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(255, 240, 180, 1)');
  grad.addColorStop(0.3, 'rgba(255, 200, 100, 0.6)');
  grad.addColorStop(1, 'rgba(255, 150, 50, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(canvas);
}

function updateFutureMeetPosition() {
  const meetEl = document.getElementById('future-meet');
  if (!meetEl?.classList.contains('is-active') || currentScene !== 'future' || !earth) return;

  earthCenterScreen.set(0, 0, 0);
  earth.localToWorld(earthCenterScreen);
  earthCenterScreen.project(camera);

  const x = (earthCenterScreen.x * 0.5 + 0.5) * window.innerWidth;
  const y = (-earthCenterScreen.y * 0.5 + 0.5) * window.innerHeight;
  meetEl.style.left = `${x}px`;
  meetEl.style.top = `${y}px`;
}

function animateFutureBackground(durationMs) {
  const bgEl = document.getElementById('future-bg');
  const hazeEl = document.getElementById('future-bg-haze');
  bgEl.classList.add('active');
  const start = performance.now();

  const tick = (now) => {
    if (currentScene !== 'future') return;
    const progress = Math.min((now - start) / durationMs, 1);
    const color = sampleFutureBgColor(progress);
    const soft = lerpHex(color, 0x5a3040, 0.22);
    const edge = lerpHex(color, 0x000000, 0.18);
    const top = rgbCss(soft);
    const mid = rgbCss(color);
    const bottom = rgbCss(edge);
    bgEl.style.background = `radial-gradient(ellipse 95% 85% at 50% 46%, ${mid} 0%, ${top} 52%, ${bottom} 100%)`;
    renderer.setClearColor(soft, 1);
    if (scene.fog) scene.fog.color.setHex(soft);

    if (hazeEl) {
      const hazeOn = progress > 0.55;
      hazeEl.classList.toggle('active', hazeOn);
      hazeEl.style.opacity = hazeOn ? String(Math.min((progress - 0.55) / 0.35, 1) * 0.85) : '0';
    }

    const meetEl = document.getElementById('future-meet');
    if (meetEl.classList.contains('is-active')) {
      const textColor = lerpHex(0xf5efe3, 0xf0dce6, Math.max(0, (progress - 0.5) / 0.5));
      meetEl.style.color = rgbCss(textColor);
    }

    if (progress < 1) {
      futureBgRaf = requestAnimationFrame(tick);
    } else {
      futureBgRaf = null;
    }
  };
  futureBgRaf = requestAnimationFrame(tick);
}

function revealMeetWords() {
  const futureEl = document.getElementById('future-text');
  futureEl.style.visibility = 'hidden';
  const meetEl = document.getElementById('future-meet');
  meetEl.innerHTML = '';
  meetEl.classList.add('is-active');
  meetEl.style.color = '#f5efe3';
  updateFutureMeetPosition();

  const charTargets = [];
  MEET_LINES.forEach((lineText) => {
    const lineEl = document.createElement('div');
    lineEl.className = 'meet-line';
    lineText.split(' ').forEach((word) => {
      const wordEl = document.createElement('span');
      wordEl.className = 'meet-word';
      lineEl.appendChild(wordEl);
      [...word].forEach((char) => charTargets.push({ char, parent: wordEl }));
    });
    meetEl.appendChild(lineEl);
  });

  let totalDuration = 0;
  charTargets.forEach((item, index) => {
    const elapsed = index * MEET_CHAR_GAP;
    totalDuration = elapsed + 1200;
    scheduleFuture(() => {
      if (currentScene !== 'future') return;
      const span = document.createElement('span');
      span.className = 'word';
      span.textContent = item.char;
      item.parent.appendChild(span);
      requestAnimationFrame(() => span.classList.add('show'));
    }, elapsed);
  });

  animateFutureBackground((totalDuration + 800) * 3);
}

window.goToFuture = function() {
  showScene('future');
  cameraTargetZ = getIdealCameraZ('future');
  resetFutureScene();
  document.getElementById('restart-btn').classList.add('show');

  const futureEl = document.getElementById('future-text');
  const futureTop = document.querySelector('#scene-future .top');

  scheduleFuture(() => {
    if (currentScene !== 'future') return;
    futureEl.style.opacity = '1';
  }, 400);

  scheduleFuture(() => {
    if (currentScene !== 'future') return;
    futureEl.style.opacity = '0';
    if (futureTop) futureTop.style.opacity = '0';
  }, 7900);

  scheduleFuture(() => {
    if (currentScene !== 'future') return;
    revealMeetWords();
  }, 10400);
};

window.restart = function() {
  document.getElementById('restart-btn').classList.remove('show');
  resetFutureScene();
  document.getElementById('name-input').value = '';
  // Clear thought lights
  thoughtLights.forEach(t => glowGroup.remove(t.sprite));
  arcLines.forEach(a => glowGroup.remove(a.line));
  thoughtLights = [];
  arcLines = [];
  earth.scale.setScalar(0.001);
  clouds.scale.setScalar(0.001);
  atmosphere.scale.setScalar(0.001);
  cameraTargetZ = getIdealCameraZ('opening');
  // Restore tap layer
  const tapLayer = document.getElementById('tap-layer');
  tapLayer.style.display = 'block';
  openingTriggered = false;
  showScene('opening');
};

// ============ Animate loop ============
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();

  // Earth rotation
  if (currentScene === 'earth' || currentScene === 'think' || currentScene === 'message' || currentScene === 'future') {
    if (!isDragging) {
      rotationVelocity *= 0.95;
      // Gentle auto-rotation
      earth.rotation.y += 0.0008 + rotationVelocity;
      clouds.rotation.y += 0.001 + rotationVelocity * 0.9;
    } else {
      earth.rotation.y += rotationVelocity;
      clouds.rotation.y += rotationVelocity * 0.9;
    }
  } else {
    earth.rotation.y += 0.0005;
    clouds.rotation.y += 0.0006;
  }

  // Camera ease
  cameraZ += (cameraTargetZ - cameraZ) * 0.02;
  camera.position.z = cameraZ;

  // Stars gentle rotation
  stars.rotation.y += 0.00005;

  // Thought lights: fade in, stay bright
  const now = performance.now();
  thoughtLights.forEach(t => {
    const age = (now - t.birth) / 1000;
    const pulse = 0.08 + Math.sin(age * 2) * 0.02;
    const baseScale = Math.min(age / 1.5, 1) * pulse;
    t.sprite.scale.setScalar(baseScale * 4);
  });
  arcLines.forEach(a => {
    const age = (now - a.birth) / 1000;
    a.line.material.opacity = Math.min(age / 1.2, 1) * (0.5 + Math.sin(age * 1.5) * 0.2);
  });

  updateFutureMeetPosition();
  renderer.render(scene, camera);
}

init();

// Wire up all buttons (module scripts can't be called from onclick attrs)
document.getElementById('restart-btn').addEventListener('click', restart);
document.getElementById('earth-next-btn').addEventListener('click', goToThink);
document.getElementById('send-btn').addEventListener('click', sendThought);

// Allow Enter key on input
document.getElementById('name-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendThought();
});
</script>
